image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, deploy]

# Keyless AWS access: the job exchanges its OIDC token for the deploy role.
# One-time setup in AWS: an IAM OIDC identity provider for gitlab.com and a
# deploy role that trusts this GitLab project (see "OpenID Connect in AWS"
# in the GitLab docs). AWS_ROLE_ARN is a GitLab CI/CD variable with that
# role's ARN. With AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE set, the AWS
# SDK inside the CDK CLI assumes the role on its own: no profile, no keys.
.aws:
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    AWS_REGION: eu-west-1
  before_script:
    - npm ci
    - echo "$AWS_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

check:
  stage: check
  script:
    - npm ci
    - npm run typecheck
    - npm test
    # openapi/openapi.yaml must match the routes and the Joi contracts: run `npm run openapi` and commit it
    - npm run openapi:check

diff:
  extends: .aws
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script: npx cdk diff -c stage=staging

deploy:staging:
  extends: .aws
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script: npx cdk deploy -c stage=staging --require-approval never

deploy:prod:
  extends: .aws
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script: npx cdk deploy -c stage=prod --require-approval never
