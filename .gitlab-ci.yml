image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, deploy]

# Keyless AWS access: the job exchanges its OIDC token for the deploy role.
# One-time setup in AWS: an IAM OIDC identity provider for gitlab.com and a
# deploy role that trusts this GitLab project (see "OpenID Connect in AWS"
# in the GitLab docs). AWS_DEPLOY_ROLE_ARN is a GitLab CI/CD variable with
# that role's ARN.
.aws:
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - npm ci
    - echo "$AWS_OIDC_TOKEN" > /tmp/oidc-token
    # Recreate the profile that cdk.json names, now backed by OIDC
    - mkdir -p ~/.aws
    - printf '[profile eugene_account_2]\nweb_identity_token_file=/tmp/oidc-token\nrole_arn=%s\nregion=eu-west-1\n' "$AWS_DEPLOY_ROLE_ARN" > ~/.aws/config

check:
  stage: check
  script:
    - npm ci
    - npm run typecheck
    - npm test
    # openapi/openapi.yaml must match the routes and the Joi contracts: run `npm run openapi` and commit it
    - npm run openapi:check

diff:
  extends: .aws
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script: npx cdk diff -c stage=staging

deploy:staging:
  extends: .aws
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script: npx cdk deploy -c stage=staging --require-approval never

deploy:prod:
  extends: .aws
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script: npx cdk deploy -c stage=prod --require-approval never
